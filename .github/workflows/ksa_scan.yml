name: KSA Numbers Scanner
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix:
        include:
          # ── 050 (10M) → 10 jobs × 1M ──
          - {id: "050-1",  args: "50 0       1000000"}
          - {id: "050-2",  args: "50 1000000 2000000"}
          - {id: "050-3",  args: "50 2000000 3000000"}
          - {id: "050-4",  args: "50 3000000 4000000"}
          - {id: "050-5",  args: "50 4000000 5000000"}
          - {id: "050-6",  args: "50 5000000 6000000"}
          - {id: "050-7",  args: "50 6000000 7000000"}
          - {id: "050-8",  args: "50 7000000 8000000"}
          - {id: "050-9",  args: "50 8000000 9000000"}
          - {id: "050-10", args: "50 9000000 9999999"}
          # ── 053 (10M) → 10 jobs ──
          - {id: "053-1",  args: "53 0       1000000"}
          - {id: "053-2",  args: "53 1000000 2000000"}
          - {id: "053-3",  args: "53 2000000 3000000"}
          - {id: "053-4",  args: "53 3000000 4000000"}
          - {id: "053-5",  args: "53 4000000 5000000"}
          - {id: "053-6",  args: "53 5000000 6000000"}
          - {id: "053-7",  args: "53 6000000 7000000"}
          - {id: "053-8",  args: "53 7000000 8000000"}
          - {id: "053-9",  args: "53 8000000 9000000"}
          - {id: "053-10", args: "53 9000000 9999999"}
          # ── 055 (10M) → 10 jobs ──
          - {id: "055-1",  args: "55 0       1000000"}
          - {id: "055-2",  args: "55 1000000 2000000"}
          - {id: "055-3",  args: "55 2000000 3000000"}
          - {id: "055-4",  args: "55 3000000 4000000"}
          - {id: "055-5",  args: "55 4000000 5000000"}
          - {id: "055-6",  args: "55 5000000 6000000"}
          - {id: "055-7",  args: "55 6000000 7000000"}
          - {id: "055-8",  args: "55 7000000 8000000"}
          - {id: "055-9",  args: "55 8000000 9000000"}
          - {id: "055-10", args: "55 9000000 9999999"}
          # ── 059 (10M) → 10 jobs ──
          - {id: "059-1",  args: "59 0       1000000"}
          - {id: "059-2",  args: "59 1000000 2000000"}
          - {id: "059-3",  args: "59 2000000 3000000"}
          - {id: "059-4",  args: "59 3000000 4000000"}
          - {id: "059-5",  args: "59 4000000 5000000"}
          - {id: "059-6",  args: "59 5000000 6000000"}
          - {id: "059-7",  args: "59 6000000 7000000"}
          - {id: "059-8",  args: "59 7000000 8000000"}
          - {id: "059-9",  args: "59 8000000 9000000"}
          - {id: "059-10", args: "59 9000000 9999999"}
          # ── باقي البوادئ ──
          - {id: "051",    args: "51 0 9999999"}
          - {id: "052",    args: "52 0 9999999"}
          - {id: "054",    args: "54 0 9999999"}
          - {id: "056",    args: "56 0 9999999"}
          - {id: "057",    args: "57 0 9999999"}
          - {id: "058",    args: "58 0 9999999"}
          - {id: "054-2",  args: "54 5000000 9999999"}
          - {id: "056-2",  args: "56 5000000 9999999"}
          - {id: "057-2",  args: "57 5000000 9999999"}
          - {id: "058-2",  args: "58 5000000 9999999"}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install aiohttp pycryptodome

      - name: Scan
        run: python ksa_worker.py ${{ matrix.args }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ksa-${{ matrix.id }}
          path: "ksa_*.csv"
          retention-days: 7
          compression-level: 9
